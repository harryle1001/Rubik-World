<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Đảo Rubik 3D</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#2a3a74;font-family:system-ui,sans-serif}
#hud{position:fixed;left:12px;top:12px;color:#d8f6ff;font-size:14px;text-shadow:0 1px 3px #000;pointer-events:none}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:#fff2;border:2px solid #fff6;opacity:0;pointer-events:none;transition:opacity .15s}
#knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:#fffc}
.btns{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:flex-end}
.btns button{width:70px;height:70px;border-radius:50%;border:2px solid #fff8;background:#1b1626aa;color:#fff;font:700 13px system-ui;touch-action:none;-webkit-user-select:none;user-select:none}
#bJump{width:84px;height:84px;background:#3d8f4acc}
@media (pointer:fine){.btns{display:none}}
canvas{touch-action:none}
#hud{line-height:1.5}
#hud,#bAct,.btns,.topbtns,#joy,#bSound,#inv,#info{z-index:26}body.rs-modal #bAct,body.rs-modal .btns,body.rs-modal .topbtns,body.rs-modal #joy,body.rs-modal #bSound,body.rs-modal #inv{display:none}.topbtns{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:26;opacity:.85}.topbtns button{padding:8px 12px;border-radius:18px;border:2px solid #fff8;background:#1b1626aa;color:#fff;font:700 14px system-ui}
#bSound{position:fixed;right:12px;top:10px;width:42px;height:42px;border-radius:50%;border:2px solid #fff8;background:#1b1626aa;font-size:20px}
#inv{position:fixed;right:64px;top:20px;color:#fff;font:700 16px system-ui;text-shadow:0 1px 3px #000}
#bAct{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:14px 22px;border-radius:30px;border:2px solid #fff;background:#f0a23a;color:#2a1a0a;font:800 17px system-ui;box-shadow:0 6px 20px #0005}
#o2{position:fixed;left:50%;top:max(55px,calc(env(safe-area-inset-top) + 55px));transform:translate(-50%,-8px);width:min(233px,62vw);height:21px;padding:0 13px 0 34px;border-radius:13px;background:#0b2a40b3;border:2px solid #bff4ff88;box-shadow:0 5px 13px #0004;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;z-index:26;box-sizing:border-box;display:flex;align-items:center}
#o2.on{opacity:1;transform:translate(-50%,0)}#o2::before{content:'🫧';position:absolute;left:8px;top:0;font-size:15px;line-height:21px}
#o2 i{display:block;width:100%;height:8px;border-radius:5px;background:#ffffff26;overflow:hidden}#o2f{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#46e3c6,#7fd0ff);transform-origin:left;transition:transform .2s linear}
#o2.low{border-color:#ffb3a1;animation:o2b .62s ease-in-out infinite alternate}#o2.low #o2f{background:linear-gradient(90deg,#ff8a6b,#ffc36b)}@keyframes o2b{to{box-shadow:0 0 21px #ff8a6bcc;border-color:#fff}}
#bDive{background:#2a7fb8cc}#bSurf{background:#3fb39acc}body.rs-modal #o2{display:none}
[hidden]{display:none!important}
.vbtns{position:fixed;right:max(12px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:26}
.vbtns button{width:52px;height:52px;border-radius:50%;border:2px solid #fff8;background:#1b1626aa;font-size:24px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:pointer}
body.rs-modal .vbtns{display:none}@media (pointer:fine){#info{bottom:max(12px,env(safe-area-inset-bottom))}}
#bUp{background:#d8632acc}#bDown{background:#3d6fb0cc}
#quiz{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0a1a2acc;padding:14px}
#quiz .card{width:min(100%,520px);background:#fff8ec;color:#3a2a1a;border-radius:22px;padding:18px;border-top:8px solid #3d8f4a;text-align:center}
#quiz .sub{margin:0;font-weight:700;opacity:.65;font-size:13px}#quiz h3{font-size:19px;margin:10px 0 14px}#quiz .big{font-size:60px}
#quiz .ch{display:grid;grid-template-columns:1fr 1fr;gap:9px}#quiz button{padding:13px 10px;border-radius:12px;border:2px solid transparent;background:#efe3cc;font:700 15px system-ui;color:#3a2a1a}
#quiz button.ok{background:#c9efc9;border-color:#3fa36b}#quiz button.bad{background:#ffd0c8;border-color:#d2553f}#quiz .ex{font-size:15px;line-height:1.5}#quiz .ex button,#qOk{margin-top:10px;width:100%;background:#f0a23a}
@media(max-width:420px){#quiz .ch{grid-template-columns:1fr}}
@media (max-width:600px){.topbtns{gap:6px;flex-wrap:nowrap;max-width:calc(100vw - 70px)}.topbtns button{padding:6px 9px;font-size:13px;white-space:nowrap}.topbtns .lbl{display:none}}
#info{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 150px);max-width:min(78vw,360px);text-align:left!important;background:#0009;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:.3s;pointer-events:none;text-align:center}</style>

</head><body>
<div class="topbtns"><button id="bSchool" title="Đến trường">🏫<span class="lbl"> Đến trường</span></button><button id="bMenu" title="Menu trường">📚<span class="lbl"> Menu trường</span></button></div><div id="info"></div>
<button id="bAct" hidden></button>
<div id="o2"><i><b id="o2f"></b></i></div>
<div id="joy"><div id="knob"></div></div>
<div class="vbtns"><button id="bBike" title="Xe đạp (B)">🚲</button><button id="bBalloon" title="Khinh khí cầu (F)">🎈</button><button id="bBell" title="Chuông (R)" hidden>🔔</button></div>
<div class="btns"><button id="bRun">Chạy</button><button id="bJump">Nhảy</button><button id="bDive" hidden>🤿 Lặn</button><button id="bSurf" hidden>⬆ Nổi</button><button id="bDown" hidden>⬇ Xuống</button><button id="bUp" hidden>⬆ Lên</button></div>
<script type="module" src="/js/ocean.js"></script>
