<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Đảo Rubik 3D</title>
<meta name="theme-color" content="#2a3a74"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Đảo Rubik">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#2a3a74;font-family:system-ui,sans-serif}
#hud{position:fixed;left:12px;top:12px;color:#d8f6ff;font-size:14px;text-shadow:0 1px 3px #000;pointer-events:none}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:#fff2;border:2px solid #fff6;opacity:0;pointer-events:none;transition:opacity .15s}
#knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:#fffc}
.btns{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:70px 84px;grid-template-areas:"l r";gap:13px;align-items:end;pointer-events:none}
.btns button{pointer-events:auto;grid-row:1;width:70px;height:70px;border-radius:50%;border:2px solid #fff8;background:#1b1626aa;color:#fff;font:700 13px system-ui;touch-action:none;-webkit-user-select:none;user-select:none}
#bRun,#bDive,#bDown{grid-area:l}#bJump,#bSurf,#bUp,#bBoost{grid-area:r;width:84px!important;height:84px!important}#bJump{background:#3d8f4acc}
@media (pointer:fine){.btns{display:none}}
canvas{touch-action:none}
#hud{line-height:1.5}
#hud,#bAct,.btns,.topbtns,#joy,#bSound,#inv,#info{z-index:26}#bAct{z-index:27}body.rs-modal #bAct,body.rs-modal .btns,body.rs-modal .topbtns,body.rs-modal #joy,body.rs-modal #bSound,body.rs-modal #inv{display:none}.topbtns{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;gap:5px;z-index:26}
.topbtns button,#bMore,#bMap{height:42px;min-width:42px;box-sizing:border-box;padding:0 8px;border-radius:21px;border:2px solid #fff8;background:#1b1626cc;color:#fff;font:700 14px system-ui;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;cursor:pointer}
.topbtns i{font-style:normal;font-size:20px;line-height:1}.topbtns .lb{display:none}.topbtns .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}.topbtns small{font:600 11px system-ui;opacity:.85}.topbtns b{font-size:14px}
.topbtns .cmp{position:absolute;left:0;top:calc(100% + 5px);font:700 12px system-ui;font-style:normal;padding:2px 8px;border-radius:13px;background:#0b2a40cc;white-space:nowrap}#bSea{position:relative}
@media (min-width:700px){.topbtns .lb{display:inline}}
#bMore{position:fixed;z-index:26;top:max(12px,env(safe-area-inset-top));right:calc(max(12px,env(safe-area-inset-right)) + 50px);font-size:20px;padding:0}
#bMore[aria-expanded=true]{background:#f0a23a;color:#231600}
#moreMenu{position:fixed;z-index:29;top:calc(max(12px,env(safe-area-inset-top)) + 50px);right:max(12px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:21px;background:#101a2ee6;box-shadow:0 6px 18px #0006}
#moreMenu button{min-height:42px;padding:0 21px;border-radius:21px;border:2px solid #fff6;background:#ffffff14;color:#fff;font:700 15px system-ui;text-align:left;white-space:nowrap;cursor:pointer}
body.rs-modal #bMore,body.rs-modal #moreMenu{display:none}
@media (max-height:500px) and (orientation:landscape){#moreMenu{top:max(12px,env(safe-area-inset-top));right:calc(max(12px,env(safe-area-inset-right)) + 100px);flex-direction:row;padding:0;background:none;box-shadow:none}#moreMenu button{background:#101a2ee6}}
#bSound{position:fixed;right:12px;top:10px;width:42px;height:42px;border-radius:50%;border:2px solid #fff8;background:#1b1626aa;font-size:20px}
#inv{position:fixed;right:64px;top:20px;color:#fff;font:700 16px system-ui;text-shadow:0 1px 3px #000}
#bAct{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 97px);max-width:min(62vw,233px);box-sizing:border-box;min-height:52px;line-height:1.2;padding:8px 21px;border-radius:30px;border:2px solid #fff;background:#f0a23a;color:#2a1a0a;font:800 17px system-ui;box-shadow:0 6px 20px #0005}
@media (pointer:coarse){#bAct::before{content:"✋ "}}
@media (pointer:fine){#bAct{right:auto;left:50%;transform:translateX(-50%);bottom:max(13px,env(safe-area-inset-bottom));max-width:min(62vw,377px)}}
#o2{position:fixed;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 89px);transform:translate(-50%,-8px);width:min(233px,62vw);height:21px;padding:0 13px 0 34px;border-radius:13px;background:#0b2a40b3;border:2px solid #bff4ff88;box-shadow:0 5px 13px #0004;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;z-index:26;box-sizing:border-box;display:flex;align-items:center}
#o2.on{opacity:1;transform:translate(-50%,0)}#o2::before{content:'🫧';position:absolute;left:8px;top:0;font-size:15px;line-height:21px}
#o2 i{display:block;width:100%;height:8px;border-radius:5px;background:#ffffff26;overflow:hidden}#o2f{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#46e3c6,#7fd0ff);transform-origin:left;transition:transform .2s linear}
#o2.low{border-color:#ffb3a1;animation:o2b .62s ease-in-out infinite alternate}#o2.low #o2f{background:linear-gradient(90deg,#ff8a6b,#ffc36b)}@keyframes o2b{to{box-shadow:0 0 21px #ff8a6bcc;border-color:#fff}}
#bDive{background:#2a7fb8cc}#bSurf{background:#3fb39acc}body.rs-modal #o2{display:none}
[hidden]{display:none!important}
.vbtns{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(50% - 116px);display:flex;flex-direction:column;gap:8px;z-index:26}
.vbtns #bBell[hidden]{display:block!important;visibility:hidden}
@media (max-height:500px) and (orientation:landscape){.vbtns{flex-direction:row;top:calc(max(12px,env(safe-area-inset-top)) + 55px)}}
.vbtns button{width:52px;height:52px;border-radius:50%;border:2px solid #fff8;background:#1b1626aa;font-size:24px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:pointer}
.vbtns button.off{opacity:.38;filter:grayscale(1)}body.rs-modal .vbtns{display:none}@media (pointer:fine){#info{bottom:max(13px,env(safe-area-inset-bottom))}}
#bUp{background:#d8632acc}#bDown{background:#3d6fb0cc}
#whistle{position:fixed;right:calc(max(12px,env(safe-area-inset-right)) + 63px);top:50%;transform:translateY(-50%);z-index:27;background:#1b1626e6;border:2px solid #fff6;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto;color:#fff;font:700 14px system-ui;min-width:190px}
#whistle button{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;border:0;background:#ffffff1c;color:#fff;font:700 15px system-ui;text-align:left;cursor:pointer}#whistle button:hover{background:#ffffff33}#whistle small{opacity:.7;font-weight:500}
#tame{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0a1a2a99;padding:14px}
#tame .card{width:min(100%,460px);background:#fff8ec;color:#3a2a1a;border-radius:22px;padding:18px;border-top:8px solid #f0a23a;text-align:center;font-family:system-ui}
#tame .big{font-size:52px}#tame h3{margin:6px 0 4px;font-size:19px}#tame p{margin:6px 0 12px;font-size:15px;line-height:1.45}
#tame .ch{display:grid;gap:8px}#tame button{padding:12px;border-radius:12px;border:2px solid transparent;background:#efe3cc;font:700 15px system-ui;color:#3a2a1a;cursor:pointer}
#tame button.ok{background:#c9efc9;border-color:#3fa36b}#tame button.bad{background:#ffd0c8;border-color:#d2553f}
#quiz{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0a1a2acc;padding:14px}
#quiz .card{width:min(100%,520px);background:#fff8ec;color:#3a2a1a;border-radius:22px;padding:18px;border-top:8px solid #3d8f4a;text-align:center}
#quiz .sub{margin:0;font-weight:700;opacity:.65;font-size:13px}#quiz h3{font-size:19px;margin:10px 0 14px}#quiz .big{font-size:60px}
#quiz .ch{display:grid;grid-template-columns:1fr 1fr;gap:9px}#quiz button{padding:13px 10px;border-radius:12px;border:2px solid transparent;background:#efe3cc;font:700 15px system-ui;color:#3a2a1a}
#quiz button.ok{background:#c9efc9;border-color:#3fa36b}#quiz button.bad{background:#ffd0c8;border-color:#d2553f}#quiz .ex{font-size:15px;line-height:1.5}#quiz .ex button,#qOk{margin-top:10px;width:100%;background:#f0a23a}
@media(max-width:420px){#quiz .ch{grid-template-columns:1fr}}
#info{position:fixed;right:calc(max(12px,env(safe-area-inset-right)) + 65px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 165px);max-width:min(calc(100vw - 89px),360px);box-sizing:border-box;text-align:left!important;background:#000b;color:#fff;padding:10px 16px;border-radius:13px;font-size:15px;line-height:1.45;opacity:0;transition:.3s;pointer-events:none;text-align:center}
@media (max-height:500px) and (orientation:landscape){#info{right:calc(max(16px,env(safe-area-inset-right)) + 188px);bottom:max(12px,env(safe-area-inset-bottom));max-width:min(46vw,320px)}}
@media (pointer:fine){#info{right:max(12px,env(safe-area-inset-right));bottom:max(13px,env(safe-area-inset-bottom))}}</style>
