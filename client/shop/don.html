<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đơn hàng — Rubik World</title>
<link rel="icon" href="/shop/img/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop/shop.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/shop/"><img src="/shop/img/logo.svg" alt=""><span>Rubik World<small>Cửa hàng cho phụ huynh</small></span></a></div></header>
<div class="gate" id="gate" hidden><div class="box"><img src="/shop/img/logo.svg" alt=""><h1>Khu vực dành cho phụ huynh</h1><p>Nếu con đang chơi, hãy nhờ bố mẹ mở trang này nhé!</p><div class="q" id="gq"></div><form id="gf"><input id="ga" inputmode="numeric" autocomplete="off" aria-label="Kết quả phép tính" placeholder="Nhập số"><div class="err" id="ge"></div><button class="btn pri" style="margin-top:13px">Tiếp tục</button></form></div></div>
<main class="doc wrap"><h1>Đơn hàng của bạn</h1><div id="out">Đang tải…</div></main>
<script src="/shop/shop.js"></script>
<script>
(() => {
  const { gate, api, vnd, esc, payBlock } = RW, q = new URLSearchParams(location.search), out = document.getElementById('out');
  let mine = []; try { mine = JSON.parse(localStorage.getItem('rw.orders')) || []; } catch (e) {}
  const id = q.get('id'), t = q.get('t') || ((mine.find(o => o.id === id) || {}).t);
  gate(() => {
    if (!id || !t) { out.innerHTML = mine.length ? '<p>Đơn đã đặt trên máy này:</p>' + mine.map(o => `<p><a href="?id=${encodeURIComponent(o.id)}&t=${o.t}">${esc(o.id)}</a></p>`).join('') : '<p>Chưa có đơn nào trên máy này. Kiểm tra email xác nhận hoặc gọi hotline kèm mã đơn.</p>'; return; }
    api(`/api/shop/order/${encodeURIComponent(id)}?t=${encodeURIComponent(t)}`).then(o => {
      out.innerHTML = `<p>Mã đơn <b>${esc(o.id)}</b> · đặt lúc ${new Date(o.at).toLocaleString('vi-VN')}</p><p class="note">Trạng thái: <b>${esc(o.statusName)}</b> ${o.paid ? '· ✅ Đã thanh toán' : ''} ${o.tracking ? '· Mã vận đơn ' + esc(o.tracking) : ''}</p>` +
        o.items.map(i => `<div class="sum"><span>${esc(i.name)} × ${i.qty}</span><span>${vnd(i.price * i.qty)}</span></div>`).join('') +
        `<div class="sum"><span>Phí giao</span><span>${o.ship ? vnd(o.ship) : 'Miễn phí'}</span></div><div class="sum t"><span>Tổng</span><span>${vnd(o.total)}</span></div><p>${esc(o.payName)}</p>` + (o.status !== 'huy' ? payBlock(o, t) : '');
    }).catch(e => { out.innerHTML = `<p class="err">${esc(e.message)}</p>`; });
  });
})();
</script>
</body>
</html>
