<!doctype html>
<!-- Ảnh bìa cổng game: nền = cảnh thật trong game (cover-scene.jpg), chữ đặt theo φ. Render: ?w=1920&h=1080&lang=en (xem docs/portals.md) -->
<html><head><meta charset="utf-8"><style>
:root{--phi:1.618}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#0b0f24;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bg{position:absolute;inset:0;background:url(cover-scene.jpg) center/cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#0b0f24e6 0%,#0b0f24a0 38.2%,#0b0f2400 61.8%),linear-gradient(0deg,#0b0f24cc 0%,#0b0f2400 38.2%)}
.box{position:absolute;left:8.3vmin;bottom:13vmin;display:flex;flex-direction:column;gap:3vmin;max-width:61.8vw}
.logo{width:21vmin;height:21vmin;border-radius:5vmin;box-shadow:0 2vmin 5vmin #0009}
h1{margin:0;color:#fff;font-weight:900;font-size:13vmin;line-height:.95;letter-spacing:-.02em;text-shadow:0 1vmin 3vmin #000a}
h1 b{display:block;color:#f6dc8a;font-size:.618em}
p{margin:0;color:#f2f0ff;font-weight:700;font-size:4.2vmin;line-height:1.3;text-shadow:0 .5vmin 2vmin #000c}
.tag{display:inline-block;align-self:flex-start;padding:1.3vmin 3vmin;border-radius:3vmin;background:#f0a23a;color:#2a1a0a;font-weight:900;font-size:4vmin;line-height:1}
body.tall .box{left:5vw;right:5vw;bottom:8vh;max-width:none}body.tall h1{font-size:15vw}body.tall p{font-size:5vw}body.tall .tag{font-size:4.5vw}
body.tall .shade{background:linear-gradient(0deg,#0b0f24f0 0%,#0b0f24a0 50%,#0b0f2400 80%)}
body.sq h1{font-size:11vmin}body.sq .logo{width:18vmin;height:18vmin}body.sq .box{bottom:8vmin;max-width:none;right:8vmin}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="box"><img class="logo" src="../../client/icons/logo.svg" alt=""><h1 id="t"></h1><p id="s"></p><span class="tag" id="g"></span></div>
<script>
const q = new URLSearchParams(location.search), en = q.get('lang') !== 'vi', w = innerWidth, h = innerHeight;
document.body.classList.toggle('tall', h > w * 1.2); document.body.classList.toggle('sq', Math.abs(h - w) < w * 0.2);
t.innerHTML = en ? 'Rubik Island<b>Mini</b>' : 'Đảo Rubik<b>Mini</b>';
s.textContent = en ? '3D open-world school · learn by playing' : 'Trường học thế giới mở 3D · vừa học vừa chơi';
g.textContent = en ? '7 brain challenges' : '7 thử thách trí tuệ';
</script></body></html>
