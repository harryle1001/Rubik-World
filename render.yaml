# Deploy 1 chạm trên Render (https://render.com): New + → Blueprint → chọn repo này → Apply.
# Tạo 1 web service (Node) + 1 Postgres để tài khoản/tiến độ KHÔNG mất khi server khởi động lại.
# Xem hướng dẫn từng bước: docs/deploy.md
services:
  - type: web
    name: truong-rubik
    runtime: node
    plan: free                  # đổi sang starter để server không "ngủ" sau 15 phút vắng người
    region: singapore           # gần Việt Nam nhất
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_KEY          # mã chủ game: Render tự sinh chuỗi ngẫu nhiên, xem ở tab Environment
        generateValue: true
      - key: TEACHER_CODE       # mã để tạo tài khoản giáo viên ở /teacher (tự sinh; chỉ đưa cho giáo viên)
        generateValue: true
      - key: FORCE_HTTPS
        value: "1"
      # Gói Phụ huynh — xem docs/payments.md. Chưa có khoá: cổng chạy chế độ GIẢ LẬP. Khoá bí mật đặt ở tab Environment (sync: false).
      - key: PUBLIC_URL
        sync: false
      # Quảng cáo chỉ ở trang người lớn (/gioi-thieu, /blog, /parent) — để trống = TẮT. Xem docs/ads.md
      - key: ADSENSE_CLIENT
        sync: false
      - key: ADSENSE_SLOT
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: MOMO_PARTNER_CODE
        sync: false
      - key: MOMO_ACCESS_KEY
        sync: false
      - key: MOMO_SECRET_KEY
        sync: false
      - key: ZALOPAY_APP_ID
        sync: false
      - key: ZALOPAY_KEY1
        sync: false
      - key: ZALOPAY_KEY2
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VIETQR_BANK_BIN
        sync: false
      - key: VIETQR_ACCOUNT_NO
        sync: false
      - key: VIETQR_ACCOUNT_NAME
        sync: false
      - key: SMTP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: truong-rubik-db
          property: connectionString
databases:
  - name: truong-rubik-db
    plan: free                  # Postgres miễn phí của Render hết hạn sau 30 ngày → nâng "basic" khi dùng thật cho cả trường
    region: singapore
    databaseName: rubik
    user: rubik
