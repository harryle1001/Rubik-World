# Deploy 1 chạm trên Render (https://render.com): New + → Blueprint → chọn repo này → Apply.
# Tạo 1 web service (Node) + 1 Postgres để tài khoản/tiến độ KHÔNG mất khi server khởi động lại.
# Xem hướng dẫn từng bước: docs/deploy.md
services:
  - type: web
    name: truong-rubik
    runtime: node
    plan: free                  # đổi sang starter để server không "ngủ" sau 15 phút vắng người
    region: singapore           # gần Việt Nam nhất
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_KEY          # mã chủ game: Render tự sinh chuỗi ngẫu nhiên, xem ở tab Environment
        generateValue: true
      - key: TEACHER_CODE       # mã để tạo tài khoản giáo viên ở /teacher (tự sinh; chỉ đưa cho giáo viên)
        generateValue: true
      - key: FORCE_HTTPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: truong-rubik-db
          property: connectionString
databases:
  - name: truong-rubik-db
    plan: free                  # Postgres miễn phí của Render hết hạn sau 30 ngày → nâng "basic" khi dùng thật cho cả trường
    region: singapore
    databaseName: rubik
    user: rubik
